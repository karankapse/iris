[project]
name = "iris-agent"
version = "0.1.0"
description = "Iris voice agent: speaks the user's confirmed reply in an emotional tone (LiveKit + Cartesia)"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[cartesia]~=1.8",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
